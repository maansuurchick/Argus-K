name: Shell Syntax Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: '.git docs templates'
          severity: error

  syntax-posix:
    name: POSIX sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить dash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dash

      - name: Проверка через dash
        run: |
          set -e
          for f in argus-k.sh install-argus.sh install-bootstrap.sh argus-k-debug.sh uninstall-argus.sh templates/S99argus; do
            echo "=== $f ==="
            dash -n "$f"
          done
          echo "Все скрипты прошли проверку синтаксиса"
